# Requires config/rbac/backup-*.yaml applied first, and a manually created secret:
#   kubectl create secret generic fusion-weave-backup-s3-secret -n fusion \
#     --from-literal=aws-access-key-id=<minio-access-key> \
#     --from-literal=aws-secret-access-key=<minio-secret-key>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fusion-weave-backup
  namespace: fusion
  labels:
    app.kubernetes.io/name: fusion-weave-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fusion-weave-backup
        spec:
          restartPolicy: Never
          serviceAccountName: fusion-weave-backup
          containers:
            - name: backup
              image: fusion-weave-operator:latest
              imagePullPolicy: Never
              command: ["/backup", "backup"]
              env:
                - name: NAMESPACE
                  value: fusion
                - name: S3_BUCKET
                  value: fusion-weave-backups
                - name: S3_BACKUP_PREFIX
                  value: fusion/backups
                - name: AWS_REGION
                  value: us-east-1
                - name: S3_ENDPOINT_OVERRIDE
                  value: http://minio.minio.svc.cluster.local:9000
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: fusion-weave-backup-s3-secret
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fusion-weave-backup-s3-secret
                      key: aws-secret-access-key
