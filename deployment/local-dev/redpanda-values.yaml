# Single-node Redpanda for local development on minikube.
# No operator, no TLS, no auth — plain Kafka-compatible broker for dev.
#
# Install:
#   helm repo add redpanda https://charts.redpanda.com
#   helm repo update
#   helm upgrade --install redpanda redpanda/redpanda \
#     --namespace redpanda \
#     -f deployment/local-dev/redpanda-values.yaml \
#     --wait

statefulset:
  replicas: 1

resources:
  cpu:
    cores: 1
  memory:
    container:
      # Required field — no default in the chart.
      max: "2Gi"

storage:
  persistentVolume:
    enabled: true
    size: 2Gi
    # minikube default StorageClass; change if you use a different one.
    storageClass: standard

# No TLS for local dev — skips cert-manager dependency entirely.
tls:
  enabled: false

# No authentication for local dev.
auth:
  sasl:
    enabled: false

# Disable external NodePort — within-cluster access only.
external:
  enabled: false

config:
  cluster:
    # Allows MinIO to auto-create the s3-events topic on first publish if the
    # manual topic creation step is skipped.
    auto_create_topics_enabled: true
