                type: array
            required:
            - image
            - type
            type: object
          status:
            description: |-
              WeaveAppStatus is the observed state. All fields are optional so a
              MergeFrom-diffed patch can never trip a "Required value" error.
            properties:
              codeSourceDeployedVersion:
                description: |-
                  CodeSourceDeployedVersion is the artifact version the Deployment last
                  rolled to (type=service with codeSource).
                type: string
              deploymentName:
                description: DeploymentName is the owned Deployment (type=service).
                type: string
              executions:
                description: Executions lists recent job executions, newest first
                  (capped).
                items:
                  description: |-
                    WeaveAppExecution records one job execution; kept in status after the Job is
                    garbage-collected by its TTL.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    entrypoint:
                      type: string
                    jobName:
                      type: string
                    message:
                      type: string
                    phase:
                      description: WeaveAppExecutionPhase is the phase of one job
                        execution.
                      enum:
                      - Running
                      - Succeeded
                      - Failed
                      type: string
                    startTime:
                      format: date-time
                      type: string
                  required:
                  - entrypoint
                  - jobName
                  - phase
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: WeaveAppPhase is the coarse lifecycle phase of a WeaveApp.
                enum:
                - Pending
                - Ready
                - Running
                - Invalid
                type: string
              validationMessage:
                description: ValidationMessage holds the reason when phase is Invalid.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
