                type: array
              executionTTLSeconds:
                description: |-
                  ExecutionTTLSeconds is how long finished Jobs (and their pod logs) are kept
                  (type=job). Defaults to 86400 (24h). The result stays in status.executions.
                format: int32
                minimum: 0
                type: integer
              externalAuthRef:
                description: |-
                  ExternalAuthRef injects an OIDC/ServiceAccount token into every job
                  execution (same mechanism and allowlists as WeaveChain.spec.externalAuthRef).
                  Only supported for type=job.
                properties:
                  mode:
                    description: |-
                      Mode selects which deploy-time allowlist Name is validated against:
                      "serviceAccount" (helm externalAuth.serviceAccounts) or "oidc" (helm
                      externalAuth.oidcSecrets).
                    enum:
                    - serviceAccount
                    - oidc
                    type: string
                  name:
                    description: |-
                      Name must match an entry in the allowlist for Mode. For serviceAccount mode
                      this is the ServiceAccount name the operator mints a TokenRequest token for.
                      For oidc mode this is the name of the Secret holding Keycloak client
                      credentials the operator uses for a client_credentials grant.
                    minLength: 1
                    type: string
                required:
                - mode
                - name
                type: object
              image:
                description: |-
                  Image is the container image to run. With codeSource set this is the runner
