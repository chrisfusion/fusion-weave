---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: weaveapps.weave.fusion-platform.io
spec:
  group: weave.fusion-platform.io
  names:
    kind: WeaveApp
    listKind: WeaveAppList
    plural: weaveapps
    shortNames:
    - fa
    singular: weaveapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WeaveApp is a single service or job with all of its Kubernetes objects owned
          by this one resource: delete it and everything it created goes with it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WeaveAppSpec is a single deployable unit: one service or one job (with one or
              more entrypoints). It replaces the template + chain + trigger + run objects
              for the simple one-step case; everything it creates is owned by the WeaveApp.
            properties:
              activeDeadlineSeconds:
                description: ActiveDeadlineSeconds is the per-execution job timeout
                  (type=job).
                format: int64
                type: integer
              args:
                description: Args are passed to the command.
                items:
                  type: string
                type: array
              codeSource:
                description: |-
                  CodeSource loads the artifact built by fusion-forge from fusion-index into
                  the container via the code-loader init container.
                properties:
                  artifactName:
                    description: ArtifactName is the full artifact name in fusion-index
                      (e.g. "org.myteam.myapp").
                    minLength: 1
                    type: string
                  indexURL:
                    description: |-
                      IndexURL is the fusion-index base URL.
                      When empty the operator falls back to the FUSION_INDEX_URL env var,
                      then to the in-cluster default http://fusion-index-backend.fusion.svc.cluster.local:8080.
                    type: string
                  loaderImage:
                    description: |-
                      LoaderImage is the init container image used to fetch and unpack the artifact.
                      When empty the operator falls back to the LOADER_IMAGE env var,
                      then to the built-in default fusion-code-loader:latest.
                    type: string
                  loaderImagePullPolicy:
                    description: |-
                      LoaderImagePullPolicy controls when the init container image is pulled.
                      Defaults to IfNotPresent. Use Never for locally built images in minikube.
                    enum:
                    - Always
                    - Never
                    - IfNotPresent
                    type: string
                  mountPath:
                    default: /weave-code
                    description: MountPath is the directory inside the main container
                      where unpacked code is available.
                    type: string
                  tag:
                    description: |-
                      Tag is the mutable tag to track (e.g. "stable", "latest").
                      The init container resolves the tag to a concrete version on every pod start.
                    minLength: 1
                    type: string
                required:
                - artifactName
                - tag
                type: object
              command:
                description: Command overrides the container entrypoint.
                items:
                  type: string
                type: array
              containerSecurityContext:
                description: ContainerSecurityContext overrides the operator-wide
                  workload security default.
                properties:
                  allowPrivilegeEscalation:
                    description: |-
                      AllowPrivilegeEscalation controls whether a process can gain more
                      privileges than its parent process. This bool directly controls if
                      the no_new_privs flag will be set on the container process.
                      AllowPrivilegeEscalation is true always when the container is:
                      1) run as Privileged
                      2) has CAP_SYS_ADMIN
                      Note that this field cannot be set when spec.os.name is windows.
                    type: boolean
                  appArmorProfile:
                    description: |-
                      appArmorProfile is the AppArmor options to use by this container. If set, this profile
