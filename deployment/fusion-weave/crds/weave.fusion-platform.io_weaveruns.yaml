                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - chainRef
            type: object
          status:
            description: WeaveRunStatus reflects the live execution state of the run.
            properties:
              activeDeployments:
                additionalProperties:
                  description: WeaveActiveDeploymentStatus tracks the health of a
                    Deployment created by a deploy step.
                  properties:
                    codeSourceArtifact:
                      description: |-
                        CodeSourceArtifact is the fusion-index artifact name tracked by this deployment.
                        Empty when the step has no codeSource.
                      type: string
                    codeSourceDeployedVersion:
                      description: |-
                        CodeSourceDeployedVersion is the artifact version currently loaded in running pods.
                        Updated each time a rolling restart is triggered by a code-source change.
                      type: string
                    codeSourceIndexURL:
                      description: CodeSourceIndexURL is the fusion-index base URL
                        used for polling.
                      type: string
                    codeSourceTag:
                      description: CodeSourceTag is the mutable tag being tracked
                        (e.g. "stable").
                      type: string
                    currentRevision:
                      description: CurrentRevision is the Deployment revision currently
                        running.
                      type: string
                    deploymentName:
                      description: DeploymentName is the name of the managed Deployment.
                      type: string
                    health:
                      description: Health is the current health phase of the Deployment.
                      enum:
                      - Healthy
                      - Unhealthy
                      - RollingBack
                      - RolledBack
                      - Unknown
                      type: string
                    lastRollbackRevision:
                      description: LastRollbackRevision is the revision rolled back
                        to (set after a rollback).
                      type: string
                    lastRollbackTime:
                      description: LastRollbackTime is when the most recent rollback
                        was triggered.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable status detail.
                      type: string
                    stepName:
                      description: StepName is the chain step that owns this Deployment.
                      type: string
                    unhealthyDurationSeconds:
                      description: |-
                        UnhealthyDurationSeconds is the unhealthyDuration from the template at
                        registration time, cached here to avoid a lookup in the health loop.
                      format: int64
                      type: integer
                    unhealthySince:
                      description: UnhealthySince is when the Deployment first entered
                        an unhealthy state.
                      format: date-time
                      type: string
                  required:
                  - deploymentName
                  - health
                  - stepName
                  type: object
                description: |-
                  ActiveDeployments tracks run-owned Deployments created via StepOverrides.
                  The map key is the Deployment name (<runName>-<stepName>). Health monitoring
                  and code-source polling for these entries are handled by the run controller.
                type: object
              completionTime:
                description: CompletionTime is when the run reached a terminal phase.
                format: date-time
                type: string
              message:
                description: Message holds a human-readable summary of the current
                  state.
                type: string
              phase:
                description: Phase is the overall lifecycle phase of this run.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Stopped
                type: string
              sharedPVCName:
                description: |-
                  SharedPVCName is the name of the per-run shared PVC, set once the PVC has
                  been successfully created. Empty when the chain has no SharedStorage config.
                type: string
              startTime:
                description: StartTime is when the run moved from Pending to Running.
                format: date-time
                type: string
              steps:
                description: Steps holds the per-step execution state, indexed by
                  step name.
                items:
                  description: WeaveRunStepStatus tracks the execution state of one
                    DAG step.
                  properties:
                    completionTime:
                      description: CompletionTime is when the step reached a terminal
                        phase.
                      format: date-time
                      type: string
                    deploymentRef:
                      description: |-
                        DeploymentRef is the name of the apps/v1 Deployment created for Deploy-kind steps.
                        Nil for Job-kind steps.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    jobRef:
                      description: JobRef is the name of the batch/v1 Job created
                        for this step.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    message:
                      description: Message holds a human-readable status detail or
                        failure reason.
                      type: string
                    name:
                      description: Name matches the WeaveChainStep name.
                      type: string
                    nextRetryAfter:
                      description: NextRetryAfter is the earliest time the step will
                        be retried.
                      format: date-time
                      type: string
                    outputCaptured:
                      description: |-
                        OutputCaptured is true once the step's JSON stdout has been successfully
                        written to the run's output ConfigMap. Only meaningful when the step's
                        WeaveChainStep has ProducesOutput: true.
                      type: boolean
                    phase:
                      description: Phase is the current lifecycle phase of this step.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      - Retrying
                      - Deployed
                      type: string
                    retryCount:
                      description: RetryCount tracks how many times this step has
                        been retried.
                      format: int32
                      type: integer
                    startTime:
                      description: StartTime is when the batch Job was first submitted.
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
            type: object
        type: object
