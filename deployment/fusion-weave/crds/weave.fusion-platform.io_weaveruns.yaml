                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              stepOverrides:
                description: |-
                  StepOverrides provides per-step deployment parameters for deploy-kind steps.
                  When a step is listed here the Deployment is named <runName>-<stepName> and
                  owned by the WeaveRun; runner configuration is read from the artifact's
                  metadata.yaml in fusion-index instead of from the WeaveServiceTemplate.
                  Non-override runs are unaffected.
                items:
                  description: |-
                    WeaveRunStepOverride provides per-step deployment parameters for a single
                    deploy-kind step. When present the operator fetches runner configuration
                    from the artifact's metadata.yaml in fusion-index rather than from the
                    WeaveServiceTemplate, and names the Deployment <runName>-<stepName> so
                    multiple runs can share the same chain without colliding.
                  properties:
                    artifactName:
                      description: ArtifactName is the full artifact name in fusion-index
                        (e.g. "app.my-service").
                      minLength: 1
                      type: string
                    indexURL:
                      default: http://fusion-index-backend.fusion.svc.cluster.local:8080
                      description: IndexURL is the fusion-index base URL used to resolve
                        the artifact.
                      type: string
                    ingressHost:
                      description: |-
                        IngressHost is the fully-qualified domain name for this service instance
                        (e.g. "my-service.example.com"). Required when the chain step uses an Ingress.
                      type: string
                    stepName:
                      description: StepName is the name of the deploy-kind step in
                        the chain to override.
                      minLength: 1
                      type: string
                    tag:
                      description: Tag is the mutable tag to track (e.g. "stable").
                      minLength: 1
                      type: string
                  required:
                  - artifactName
                  - stepName
                  - tag
                  type: object
                type: array
              triggerRef:
