kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: weaveruns.weave.fusion-platform.io
spec:
  group: weave.fusion-platform.io
  names:
    kind: WeaveRun
    listKind: WeaveRunList
    plural: weaveruns
    shortNames:
    - fr
    singular: weaverun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
