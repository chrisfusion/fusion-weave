{{- $gitops := .Values.gitops | default dict -}}
{{- $gitopsSA := $gitops.serviceAccount | default dict -}}
{{- if $gitops.enabled }}
# SPDX-License-Identifier: GPL-3.0-or-later
# Identity for Flux Kustomizations that apply user-owned git repos
# (Kustomization.spec.serviceAccountName) — see gitops-role.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $gitopsSA.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
{{- end }}
