# SPDX-License-Identifier: GPL-3.0-or-later
{{- $cs := .Values.codeSource | default dict -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- $workload := .Values.workload | default dict -}}
{{- $defaultWorkloadSecurity := dict
    "podAnnotations" dict
    "podLabels" dict
    "podSecurityContext" (dict "runAsNonRoot" true "runAsUser" 65532 "fsGroup" 65532 "seccompProfile" (dict "type" "RuntimeDefault"))
    "containerSecurityContext" (dict "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) "readOnlyRootFilesystem" true) }}
{{- $workloadSecurity := merge ($workload.security | default dict) $defaultWorkloadSecurity }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fusion-weave.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fusion-weave.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "fusion-weave.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/manager"]
          args:
            - --metrics-bind-address=:{{ .Values.ports.metrics }}
            - --health-probe-bind-address=:{{ .Values.ports.health }}
            - --webhook-bind-address=:{{ .Values.ports.webhook }}
            - --namespace={{ .Release.Namespace }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
            - name: health
              containerPort: {{ .Values.ports.health }}
            - name: webhook
              containerPort: {{ .Values.ports.webhook }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ports.health }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.ports.health }}
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: CODE_SOURCE_POLL_INTERVAL
              value: {{ $cs.pollInterval | default "60s" | quote }}
            - name: WORKLOAD_SECURITY_DEFAULTS
              value: {{ toJson $workloadSecurity | quote }}
            {{- if $cs.indexURL }}
            - name: FUSION_INDEX_URL
              value: {{ $cs.indexURL | quote }}
            {{- end }}
            {{- if $cs.loaderImage }}
            - name: LOADER_IMAGE
              value: {{ $cs.loaderImage | quote }}
            {{- end }}
            {{- if $cs.writablePaths }}
            - name: WRITABLE_PATHS
              value: {{ join ":" $cs.writablePaths | quote }}
            {{- end }}
            {{- if $ingress.hostSuffix }}
            - name: INGRESS_HOST_SUFFIX
              value: {{ $ingress.hostSuffix | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
