{{- $gitops := .Values.gitops | default dict -}}
{{- $gitopsSA := $gitops.serviceAccount | default dict -}}
{{- if $gitops.enabled }}
# SPDX-License-Identifier: GPL-3.0-or-later
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $gitopsSA.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
rules:
  # Only WeaveApps (and the wizard CRDs below) — a gitopsed repo must not be able
  # to create Deployments, Jobs, Secrets, chains/templates or anything else directly.
  # No status subresource: status is owned by the operator. Flux needs create/patch
  # to server-side apply, get/list/watch for health checks and delete to prune.
  - apiGroups: ["weave.fusion-platform.io"]
    resources:
      - weaveapps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- with $gitops.wizardResources }}
  - apiGroups: ["wizard.fusion-platform.io"]
    resources:
      {{- toYaml . | nindent 6 }}
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
{{- end }}
