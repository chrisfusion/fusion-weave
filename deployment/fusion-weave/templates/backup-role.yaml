{{- $backup := .Values.backup | default dict -}}
{{- $backupSA := $backup.serviceAccount | default dict -}}
{{- if $backup.enabled }}
# SPDX-License-Identifier: GPL-3.0-or-later
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $backupSA.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
rules:
  # Read-only, and deliberately excludes weaveruns — the backup CronJob only ever
  # dumps WeaveJobTemplate/WeaveServiceTemplate/WeaveChain/WeaveTrigger specs.
  - apiGroups: ["weave.fusion-platform.io"]
    resources:
      - weavejobtemplates
      - weaveservicetemplates
      - weavechains
      - weavetriggers
    verbs: ["get", "list", "watch"]
{{- end }}
