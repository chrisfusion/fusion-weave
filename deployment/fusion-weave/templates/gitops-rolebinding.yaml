{{- $gitops := .Values.gitops | default dict -}}
{{- $gitopsSA := $gitops.serviceAccount | default dict -}}
{{- if $gitops.enabled }}
# SPDX-License-Identifier: GPL-3.0-or-later
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $gitopsSA.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $gitopsSA.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $gitopsSA.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
