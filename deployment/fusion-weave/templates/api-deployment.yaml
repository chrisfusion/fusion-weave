{{- $api := .Values.api | default dict -}}
{{- $apiAuth := $api.auth | default dict -}}
{{- $apiMonitoring := $api.monitoring | default dict -}}
{{- $apiMonitoringKafka := $apiMonitoring.kafka | default dict -}}
{{- $apiLog := $api.log | default dict -}}
{{- $apiService := $api.service | default dict -}}
{{- $apiImage := $api.image | default dict -}}
{{- $apiSA := $api.serviceAccount | default dict -}}
{{- if $api.enabled }}
# SPDX-License-Identifier: GPL-3.0-or-later
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
spec:
  replicas: {{ $api.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "fusion-weave.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fusion-weave.api.selectorLabels" . | nindent 8 }}
        {{- with $api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $apiSA.name }}
      {{- with $api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-server
          image: {{ include "fusion-weave.api.image" . }}
          imagePullPolicy: {{ default .Values.image.pullPolicy $apiImage.pullPolicy }}
          command: ["/api-server"]
          env:
            - name: NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: AUTH_APIKEY
              value: {{ $apiAuth.apiKeyEnabled | toString | quote }}
            - name: AUTH_OIDC
              value: {{ $apiAuth.oidcEnabled | toString | quote }}
            {{- if $apiAuth.oidcIssuerURL }}
            - name: OIDC_ISSUER_URL
              value: {{ $apiAuth.oidcIssuerURL | quote }}
            {{- end }}
            {{- if $apiAuth.oidcClientID }}
            - name: OIDC_CLIENT_ID
              value: {{ $apiAuth.oidcClientID | quote }}
            {{- end }}
            - name: OIDC_ROLE_CLAIM
              value: {{ $apiAuth.oidcRoleClaim | default "fusion-weave-role" | quote }}
            - name: AUTH_SA
              value: {{ $apiAuth.saAuthEnabled | toString | quote }}
            - name: ALLOW_UNAUTHENTICATED
              value: {{ $apiAuth.allowUnauthenticated | toString | quote }}
            - name: MONITORING_ENABLED
              value: {{ $apiMonitoring.enabled | toString | quote }}
            - name: METRICS_ADDR
              value: {{ printf ":%d" (int ($apiMonitoring.metricsPort | default 9091)) | quote }}
            - name: MONITOR_CACHE_TTL
              value: {{ $apiMonitoring.cacheTTL | default "30s" | quote }}
            - name: MONITOR_LOG_LINES
              value: {{ $apiMonitoring.maxLogLines | default 100 | toString | quote }}
            {{- if $apiMonitoringKafka.brokers }}
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BROKERS
              value: {{ $apiMonitoringKafka.brokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ $apiMonitoringKafka.topic | default "weave-logs" | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ $apiLog.level | default "info" | quote }}
            - name: LOG_FORMAT
              value: {{ $apiLog.format | default "json" | quote }}
          ports:
            - name: http
              containerPort: {{ $apiService.port | default 8082 }}
            {{- if $apiMonitoring.enabled }}
            - name: metrics
              containerPort: {{ $apiMonitoring.metricsPort | default 9091 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $apiService.port | default 8082 }}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $apiService.port | default 8082 }}
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml ($api.resources | default dict) | nindent 12 }}
          {{- with $api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
