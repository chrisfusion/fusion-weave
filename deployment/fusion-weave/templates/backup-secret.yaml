{{- $backup := .Values.backup | default dict -}}
{{- $s3 := $backup.s3 | default dict -}}
{{/*
  Secret for static AWS credentials — only created when the backup CronJob is
  enabled, credentialsType is "static", and no existingSecret is provided.
  fusion-flux has no other S3 usage, so unlike fusion-index's s3-secret this is
  purely a backup-CronJob concern.
*/}}
{{- if and $backup.enabled (eq $s3.credentialsType "static") (not $s3.existingSecret) }}
# SPDX-License-Identifier: GPL-3.0-or-later
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backup-s3-secret" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
type: Opaque
stringData:
  aws-access-key-id:     {{ $s3.accessKeyId | required "backup.s3.accessKeyId is required when credentialsType=static and no existingSecret is set" | quote }}
  aws-secret-access-key: {{ $s3.secretAccessKey | required "backup.s3.secretAccessKey is required when credentialsType=static and no existingSecret is set" | quote }}
{{- end }}
