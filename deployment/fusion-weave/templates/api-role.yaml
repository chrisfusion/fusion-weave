{{- $api := .Values.api | default dict -}}
{{- $apiAuth := $api.auth | default dict -}}
{{- $apiSA := $api.serviceAccount | default dict -}}
{{- if $api.enabled }}
# SPDX-License-Identifier: GPL-3.0-or-later
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $apiSA.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fusion-weave.labels" . | nindent 4 }}
rules:
  - apiGroups: ["weave.fusion-platform.io"]
    resources:
      - weavejobtemplates
      - weavejobtemplates/status
      - weaveservicetemplates
      - weaveservicetemplates/status
      - weavechains
      - weavechains/status
      - weavetriggers
      - weavetriggers/status
      - weaveruns
      - weaveruns/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if $apiAuth.saAuthEnabled }}
  # SA auth — get the calling ServiceAccount to read its fusion-platform.io/role label.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  {{- end }}
  {{- if $apiAuth.apiKeyEnabled }}
  # Secrets listed to resolve API key credentials (label: fusion-platform.io/api-key=true).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  {{- end }}
  # Monitoring API — read batch Jobs, Deployments, Events, and pod logs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- end }}
