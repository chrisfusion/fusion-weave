# Set to true to have the chart create the namespace.
# Set to false if the namespace already exists (avoids Helm ownership conflicts).
namespaceCreate: true

image:
  repository: ghcr.io/chrisfusion/fusion-weave-operator
  tag: "0.2.1"
  pullPolicy: IfNotPresent

# Extra annotations added to the operator pod template.
# Useful for tooling (e.g. Datadog APM, Vault agent) or custom admission webhooks.
podAnnotations: {}

# Extra labels added to the operator pod template.
# Useful for NetworkPolicies, PodDisruptionBudgets, or tag-based monitoring.
podLabels: {}

# Pod-level security context for the operator pod.
# Fields map 1:1 to corev1.PodSecurityContext — any valid field can be set here.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Container-level security context for the operator container.
# Fields map 1:1 to corev1.SecurityContext.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# Number of operator replicas. Set >1 only together with leaderElection.enabled=true.
replicaCount: 1

leaderElection:
  enabled: false

serviceAccount:
  name: fusion-weave-operator

# Resource requests and limits for the operator pod.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Ports used by the operator.
ports:
  metrics: 8080
  health: 8081
  webhook: 9090

# Webhook trigger HTTP service configuration.
webhookService:
  enabled: true
  type: ClusterIP
  port: 9090

# REST API server configuration.
api:
  # Set to false to skip deploying the API server entirely.
  enabled: true

  # Image — defaults to the same image as the operator (both binaries are in the same image).
  # Override repository/tag here only when deploying from a separate image.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  serviceAccount:
    name: fusion-weave-api

  replicaCount: 1

  # Extra annotations added to the API server pod template.
  podAnnotations: {}

  # Extra labels added to the API server pod template.
  podLabels: {}

  # Pod-level security context for the API server pod.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  # Container-level security context for the API server container.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  service:
    type: ClusterIP
    port: 8082

  auth:
    # Enable API key authentication (Secrets labelled fusion-platform.io/api-key=true).
    apiKeyEnabled: false
    # Enable OIDC JWT authentication.
    oidcEnabled: false
    oidcIssuerURL: ""
    oidcClientID: ""
    oidcRoleClaim: "fusion-weave-role"
    # Enable Kubernetes ServiceAccount token authentication via TokenReview.
    # Requires the api-clusterrole template (tokenreviews permission).
    saAuthEnabled: true
    # Skip all auth checks — cluster-internal mode only. Grants full admin. Never use in production.
    allowUnauthenticated: false

  monitoring:
    # Enable the /monitor/v1 API routes.
    enabled: false
    # metricsPort is the port for the dedicated Prometheus metrics server (no auth).
    metricsPort: 9091
    # cacheTTL is the TTL for all monitoring in-memory cache entries (Go duration string).
    cacheTTL: "30s"
    # maxLogLines is the maximum number of tail log lines returned per step log request.
    maxLogLines: 100
    # kafka configures the optional Kafka log sink for streaming log snapshots.
    # Leave brokers empty to use a no-op sink (no Kafka dependency at runtime).
    kafka:
      brokers: ""
      topic: "weave-logs"

  log:
    # Minimum log level for the API HTTP layer: debug | info | warn | error
    level: "info"
    # Log output format: json | text  (json is default for Kubernetes log collectors)
    format: "json"

# Security defaults applied to every pod the operator creates at runtime —
# both batch Job pods (job steps) and Deployment pods (deploy steps).
# These are separate from the operator/API pod security configured above.
# All values are serialized to JSON and passed to the operator via
# WORKLOAD_SECURITY_DEFAULTS; the operator applies them to every pod it creates.
workload:
  security:
    # Extra annotations merged into every workload pod template.
    # Use for Seccomp/AppArmor annotations, Istio injection, Datadog APM, etc.
    podAnnotations: {}

    # Extra labels merged into every workload pod template.
    # Use for NetworkPolicies, PodDisruptionBudgets, monitoring tag selectors.
    podLabels: {}

    # Pod-level security context for every workload pod.
    # Supports any corev1.PodSecurityContext field (e.g. seccompProfile, runAsUser).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

    # Container-level security context applied to every workload container,
    # including the code-loader init container in deploy steps.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true

# Code-source polling configuration.
# Controls how often the chain controller checks fusion-index for artifact tag changes.
codeSource:
  # pollInterval is a Go duration string (e.g. "30s", "2m"). Maps to CODE_SOURCE_POLL_INTERVAL.
  pollInterval: "60s"
  # indexURL is the cluster-wide default base URL for fusion-index.
  # Applied to any deploy step whose WeaveServiceTemplate does not set codeSource.indexURL.
  # Maps to FUSION_INDEX_URL on the operator pod.
  # Leave empty to use the built-in default: http://fusion-index-backend.fusion.svc.cluster.local:8080
  indexURL: ""
  # loaderImage is the cluster-wide default init container image for code-source deploy steps.
  # Applied to any deploy step whose WeaveServiceTemplate does not set codeSource.loaderImage.
  # Maps to LOADER_IMAGE on the operator pod.
  # Recommended: set this to your registry push of Dockerfile.loader (e.g. ghcr.io/org/fusion-code-loader:0.2.1).
  # Leave empty to use the built-in default: fusion-code-loader:latest
  loaderImage: ""
  # writablePaths is a list of paths that receive a writable emptyDir volume in every
  # service container (both the code-loader init container and the main container) for
  # deploy steps that have a codeSource. Required when readOnlyRootFilesystem: true is
  # set in the workload security defaults so that runners can extract archives, install
  # dependencies, and write cache/temp files.
  writablePaths:
    - /tmp
    - /home/nonroot
    - /weave-work

# Ingress hostname configuration.
ingress:
  # hostSuffix is the cluster-wide domain suffix appended to every ingress
  # rule's "name" to form the full Ingress hostname: "<name>.<hostSuffix>".
  # Users configuring WeaveServiceTemplate/WeaveRun ingress can only supply
  # the leftmost label — never a full domain — so an Ingress can never be
  # pointed at a hostname the operator doesn't own. Maps to INGRESS_HOST_SUFFIX
  # on the operator pod. A WeaveServiceTemplate with an ingress is invalid
  # (status.valid=false) until this is set.
  # Example: "svc.instance-a.fusion.company.com"
  hostSuffix: ""

# Periodic S3 backup of WeaveJobTemplate/WeaveServiceTemplate/WeaveChain/WeaveTrigger
# specs (never WeaveRun, never .status) for disaster recovery. One day of staleness
# is acceptable — see cmd/backup. Restore is manual-only, not chart-templated.
backup:
  # Set to true to deploy the daily backup CronJob.
  enabled: false

  # schedule is a standard cron expression (CronJob spec.schedule).
  schedule: "0 3 * * *"

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  activeDeadlineSeconds: 1800

  # Image — defaults to the same image as the operator (both binaries are in the same image).
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  serviceAccount:
    name: fusion-weave-backup

  s3:
    bucket: ""
    # backupPrefix is the S3 key prefix for backup objects. Left empty (default),
    # resolves to "<kubernetes-namespace>/backups".
    backupPrefix: ""
    region: us-east-1
    # endpointOverride is set for MinIO, Ceph, or custom S3-compatible endpoints.
    endpointOverride: ""
    # credentialsType: "static" injects AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from a
    # Secret (accessKeyId/secretAccessKey below, or existingSecret); "default" relies
    # on the AWS SDK's default credential chain (IRSA, instance role, etc.).
    credentialsType: static
    existingSecret: ""
    accessKeyId: ""
    secretAccessKey: ""

# Showroom: a curated, preseeded set of example WeaveChains demonstrating the
# platform's major features. Disabled by default.
# Deploy the full tour with: helm upgrade --install ... --set showroom.enabled=true
#
# Tier 1 (showroom.chains.*) is fully self-contained — busybox/nginx images
# only, no external dependency, installs and runs immediately.
#
# Tier 2 (showroom.codeSourceApps.*) deploys real artifacts built from
# ../fusion-testcases/testcases_v2 via fusion-forge and published to
# fusion-index under tag "stable". Those artifacts must already exist before
# enabling this tier — see testcases_v2/README.md. Gated separately from Tier
# 1 so the zero-dependency tour still installs standalone.
showroom:
  enabled: false

  chains:
    dagBasics: true
    sharedStorage: true
    deployIngress: true
    stepIO: true
    triggerOnDemand: true
    triggerCron: true
    triggerBatchCron: true
    # triggerKafka only fires against a reachable broker. Off by default —
    # point showroom.kafka.brokers/topic at your own broker before enabling
    # (see deployment/local-dev/redpanda-values.yaml for a dev Redpanda setup).
    triggerKafka: false

  # Shared storage settings used by the sharedStorage demo chain.
  sharedStorage:
    # size is the PVC capacity requested for the demo run.
    size: "500Mi"
    # storageClassName is the StorageClass to request.
    # Leave empty to use the cluster default.
    # NOTE: the StorageClass must support ReadWriteMany (e.g. NFS, CephFS).
    # The default "standard" class on minikube does NOT support RWX.
    storageClassName: ""

  # deployIngress demo chain's Ingress rule settings. ingressName is the DNS-label
  # hostname prefix — the full Ingress host becomes "<ingressName>.<ingress.hostSuffix>".
  # Requires the cluster-wide ingress.hostSuffix (above) to already be set —
  # otherwise the WeaveServiceTemplate stays status.valid=false and the chain
  # never progresses past the deploy step.
  deployIngress:
    ingressName: showroom

  # Kafka broker settings used by the triggerKafka demo chain (only read when
  # showroom.chains.triggerKafka=true). Matches deployment/local-dev conventions.
  kafka:
    brokers:
      - redpanda-0.redpanda.redpanda.svc.cluster.local:9093
    topic: s3-events
    consumerGroup: fusion-weave-showroom

  codeSourceApps:
    enabled: false
    streamlitShowcase: true
    batchReport: true
    # batchMetadata: a codeSource-backed Job step fired on a BatchCron
    # schedule (not OnDemand like the other two) — the step reads both its
    # own artifact metadata and the firing job's BatchCron metadata.
    batchMetadata: true
